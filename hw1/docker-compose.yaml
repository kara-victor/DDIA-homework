services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DEPLOYMENT_NAME: characters-service
      DATACENTER: dc-1
      POD_NAME: pod-1

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.152.0

    ports:
      - "127.0.0.1:8428:8428"

    volumes:
      - ./monitoring/victoriametrics.yaml:/etc/victoriametrics/victoriametrics.yaml:ro
      - victoria_data:/victoria-metrics-data

    command:
      - "-promscrape.config=/etc/victoriametrics/victoriametrics.yaml"
      - "-storageDataPath=/victoria-metrics-data"

    depends_on:
      app:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.4.11

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro

    depends_on:
      victoriametrics:
        condition: service_started

    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  dashboard-generator:
    build: .
    volumes:
      - ./dashboard_generator.py:/app/dashboard_generator.py:ro
    environment:
      APP_URL: http://app:8000
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:?Set GRAFANA_SERVICE_ACCOUNT_TOKEN in .env}
    depends_on:
      app:
        condition: service_healthy
      grafana:
        condition: service_healthy
    command: python dashboard_generator.py

  load-generator:
    build: .
    volumes:
      - ./load_generator.py:/app/load_generator.py:ro
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    command: python load_generator.py

volumes:
  victoria_data:
  grafana_data: